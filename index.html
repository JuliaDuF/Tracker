<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Second Half</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Newsreader:ital,opsz@1,6..72&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paper: #E7E7E0; --surface: #F1F1EB; --ink: #2A2B26; --muted: #83857A; --line: #D4D4CA;
      --line-soft: rgba(42,43,38,0.10);
      --accent: #6F7F73; --accent-ink: #55634F; --accent-soft: rgba(111,127,115,0.13); --warn: #A8735B;
      --gold: #B9985E; --silver: #9AA6B0; --bronze: #A9744F;
    }
    body { background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 48px 26px 90px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .title { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.04; margin: 14px 0 28px; }
    .note { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 16px; color: var(--muted); margin: 16px 0 24px; line-height: 1.5; }

    .editbtn { font-family: inherit; font-size: 13px; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid transparent; border-radius: 20px; padding: 8px 16px; cursor: pointer; white-space: nowrap; }
    .editbtn.on { background: var(--accent); color: #fff; }
    .plus { font-family: inherit; font-size: 13px; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid transparent; border-radius: 20px; padding: 8px 13px; cursor: pointer; line-height: 1; }
    .head-controls { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(42,43,38,0.35); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: var(--paper); border-radius: 16px; padding: 22px; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; }
    .modal-box h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 19px; margin-bottom: 14px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }

    .quick { margin: 18px 0; }
    .quickbox { display: flex; gap: 10px; align-items: center; }
    .qinput { flex: 1 1 auto; font-family: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; min-width: 0; }
    .qinput::placeholder { color: var(--muted); }
    .qinput:focus { outline: none; border-color: var(--accent); }
    .qfb { font-size: 13px; margin-top: 9px; }
    .qfb.ok { color: var(--accent-ink); }
    .qfb.err { color: var(--warn); }

    .due-banner { margin: 18px 0; padding: 15px 17px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 13px; }
    .due-item { font-size: 13px; color: var(--muted); padding: 3px 0; }
    .due-item b { color: var(--warn); font-weight: 500; }
    .data-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; cursor: pointer; }
    .data-row input[type="checkbox"] { flex: 0 0 auto; }
    .data-date { flex: 0 0 62px; color: var(--muted); }
    .data-label { flex: 1 1 auto; color: var(--ink); }

    .backup-buttons { display: flex; gap: 8px; margin-bottom: 18px; align-items: center; }
    .btn-backup { font-family: inherit; font-size: 12px; padding: 6px 11px; border-radius: 8px; border: none; background: var(--accent-soft); color: var(--accent-ink); cursor: pointer; }

    .section { margin-top: 40px; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line-soft); padding-bottom: 10px; margin-bottom: 8px; }
    .h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 22px; color: var(--ink); background: none; border: none; border-bottom: 1px solid transparent; padding: 2px 0; flex: 1 1 auto; min-width: 0; }
    .h2:focus { outline: none; border-bottom-color: var(--accent); }
    .meta { font-size: 12px; color: var(--muted); }

    .tabs { display: flex; gap: 16px; margin-bottom: 8px; }
    .tab { font-family: inherit; font-size: 13px; color: var(--muted); background: none; border: none; padding: 0 0 4px; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }

    .arrows { display: inline-flex; gap: 3px; }
    .arrow { font-family: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
    .arrow:disabled { opacity: 0.3; cursor: default; }

    .outrow { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
    .outname { flex: 1 1 auto; font-size: 15px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .outrow.grp .outname { color: var(--accent-ink); font-weight: 500; }
    .outrow.leaf { padding-left: 22px; }

    .card { padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
    .card.paused { opacity: 0.5; }
    .card-head { display: flex; align-items: center; gap: 10px; }
    .cname { flex: 1 1 auto; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 18px; color: var(--ink); background: none; border: none; border-bottom: 1px solid transparent; padding: 2px 0; }
    .cname:focus { outline: none; border-bottom-color: var(--accent); }
    .btn-x { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: inline-flex; align-items: center; justify-content: center; }
    .badge-pause { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 20px; white-space: nowrap; }

    .figure { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 24px; margin-top: 10px; }
    .figure small { font-size: 14px; color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 400; margin-left: 7px; }
    .bar { height: 6px; background: var(--line-soft); border-radius: 6px; overflow: hidden; margin: 10px 0; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; }
    .pace { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 15px; color: var(--muted); line-height: 1.45; }
    .pace b { color: var(--accent-ink); font-weight: 400; font-style: normal; }

    .chips { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0 6px; }
    .chip { font-family: inherit; font-size: 12px; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
    .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .link { background: none; border: none; color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 0; font-family: inherit; }
    .mini { font-family: inherit; font-size: 13px; color: var(--accent-ink); background: var(--accent-soft); border: none; border-radius: 8px; padding: 8px 13px; cursor: pointer; }

    input[type="text"]:not(.cname):not(.rname):not(.h2), input[type="number"], input[type="date"], input[type="time"], select {
      font-family: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    }
    input.short { width: 68px; }
    input.coin-in { width: 52px; }
    input.unit { width: 46px; text-align: center; }
    .cname:focus, .rname:focus { outline: none; border-bottom-color: var(--accent); }

    .panel { margin-top: 12px; padding: 15px; background: var(--surface); border-radius: 11px; display: flex; flex-direction: column; gap: 11px; }
    .field { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .field label { min-width: 60px; }

    .pips { display: flex; gap: 6px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
    .pip { width: 26px; height: 8px; border-radius: 5px; border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 0; }
    .pip.done { background: var(--accent); border-color: var(--accent); }
    .pip.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .stage-now { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 16px; color: var(--ink); margin-top: 2px; }

    .routine { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
    .r-row1, .r-row2, .r-row3 { display: flex; align-items: center; gap: 8px; flex: 1 1 100%; }
    .r-row1 { justify-content: space-between; }
    .rname { flex: 1 1 130px; font-size: 16px; color: var(--ink); background: none; border: none; border-bottom: 1px solid transparent; padding: 2px 0; }
    .status { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .status.warn { color: var(--warn); }
    .status.ok { color: var(--accent-ink); }

    .group-head { display: flex; align-items: center; gap: 8px; padding: 12px 0; }
    .disc { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; }
    .group-items { padding-left: 16px; border-left: 2px solid var(--line-soft); margin: 0 0 10px 6px; }

    .entry { display: flex; gap: 12px; font-size: 13px; color: var(--muted); padding: 5px 0; }
    .entry b { color: var(--ink); font-weight: 500; min-width: 52px; }
    .hist { margin-top: 10px; }

    .add { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .input { flex: 1 1 auto; font-size: 16px; font-family: inherit; color: var(--ink); background: transparent; border: none; border-bottom: 1px solid var(--line); padding: 8px 0; }

    .coins-row { display: flex; gap: 26px; align-items: flex-end; margin-top: 10px; flex-wrap: wrap; }
    .coin-stack { display: flex; flex-direction: column; align-items: center; }
    .coin-pile { display: flex; flex-direction: column; }
    .coin { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid; background: radial-gradient(circle, transparent 58%, currentColor 58% 61%, transparent 61%); }
    .coin:not(:first-child) { margin-top: -23px; }
    .coin-gold { border-color: var(--gold); color: var(--gold); }
    .coin-silver { border-color: var(--silver); color: var(--silver); }
    .coin-bronze { border-color: var(--bronze); color: var(--bronze); }
    .coin-label { font-size: 12px; color: var(--muted); margin-top: 8px; white-space: nowrap; }
    .cdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid; vertical-align: middle; margin-right: 5px; }

    #importFile { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <div class="eyebrow" id="todayLabel"></div>
        <button class="editbtn" id="editBtn" onclick="toggleEdit()">Edit</button>
      </div>
      <h1 class="title">Personal Tracker</h1>
    </header>

    <div class="backup-buttons">
      <button class="btn-backup" onclick="exportData()">📥 Export backup</button>
      <button class="btn-backup" onclick="document.getElementById('importFile').click()">📤 Import backup</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(event)" />
      <span id="syncStatus" style="font-size:11px;color:var(--muted);margin-left:auto;align-self:center;">☁️ checking…</span>
    </div>

    <div class="quick" id="quickWrap">
      <div class="quickbox">
        <input type="text" class="qinput" id="quickInput" placeholder="say it plainly" onkeydown="if(event.key==='Enter') handleQuick()" />
        <button class="mini" onclick="handleQuick()">Add</button>
      </div>
      <div id="quickFeedback"></div>
    </div>

    <div id="dueBanner"></div>

    <div id="sectionsContainer"></div>

    <div class="row" style="justify-content:center;margin-top:36px;">
      <button class="link" onclick="toggleDataPanel()">All data</button>
    </div>
    <div id="dataPanel"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script>
    const uid = () => Math.random().toString(36).slice(2, 9);
    const DAY = 86400000;

    function dateKey(d) {
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    const todayKey = () => dateKey(new Date());
    function setTodayLabel() {
      const el = document.getElementById('todayLabel');
      if (!el) return;
      const d = new Date();
      const weekday = d.toLocaleDateString('en-US', { weekday: 'long' });
      const monthDay = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
      el.textContent = `${weekday} · ${monthDay}, ${d.getFullYear()}`;
    }
    function openModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      document.getElementById('modalOverlay').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }
    function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
    function daysUntil(dateStr) { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((parseDate(dateStr) - t) / DAY); }
    function fmtShort(s) { try { return parseDate(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); } catch (e) { return s; } }
    function fmtMinutes(min) { if (!min) return '0m'; const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? `${h}h${m ? ` ${m}m` : ''}` : `${m}m`; }
    const round1 = (n) => Math.round(n * 10) / 10;
    const toMin = (t) => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); };
    function addByCadence(date, cadence) {
      const x = new Date(date);
      if (cadence === 'weekly') x.setDate(x.getDate() + 7);
      else if (cadence === 'monthly') x.setMonth(x.getMonth() + 1);
      else x.setFullYear(x.getFullYear() + 1);
      return x;
    }
    function sleepDur(bed, wake) { const b = toMin(bed), w = toMin(wake); if (b == null || w == null) return null; let ww = w; if (ww <= b) ww += 1440; return (ww - b) / 60; }
    function bedVal(bed) { const b = toMin(bed); if (b == null) return null; let h = b / 60; if (h < 12) h += 24; return h; }

    const leaf = (name, cad, aliases = []) => ({ id: uid(), name, mode: 'cadence', cadence: cad, nextDate: null, history: [], paused: false, aliases });
    const TRASH_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

    const SECTION_TITLE = { body: 'Body', savings: 'Savings', movement: 'Movement', projects: 'Projects', routines: 'Routines' };

    const SEED = {
      sectionOrder: ['body', 'savings', 'movement', 'projects', 'routines'],
      sectionTitles: { body: 'Body', savings: 'Savings', movement: 'Movement', projects: 'Projects', routines: 'Routines' },
      bodyOrder: ['sleep', 'weight'],
      sleep: { entries: [], paused: false },
      weight: { unit: 'kg', entries: [], paused: false },
      savings: { tx: [] },
      activities: [
        { id: uid(), name: 'Yoga', hasGoal: true, goalKind: 'days', target: 100, deadline: '2026-12-31', defaultMin: 30, aliases: ['瑜伽', 'yoga'], logs: [], paused: false },
        { id: uid(), name: 'Brisk walk', hasGoal: true, goalKind: 'days', target: 120, deadline: '2026-12-31', defaultMin: 30, aliases: ['快走', '散步', '走路', 'walk'], logs: [], paused: false },
        { id: uid(), name: 'Archery', hasGoal: false, goalKind: 'days', target: 0, deadline: '2026-12-31', defaultMin: 90, aliases: ['射箭', '箭', 'archery'], logs: [], paused: false },
        { id: uid(), name: 'Horse riding', hasGoal: false, goalKind: 'days', target: 0, deadline: '2026-12-31', defaultMin: 60, aliases: ['骑马', '马', 'riding', 'horse'], logs: [], paused: false },
      ],
      projects: [
        { id: uid(), name: 'Portfolio', stages: ['Gather work', 'Wireframe', 'Visual design', 'Write case studies', 'Polish'], current: 0, sessions: [], aliases: ['portfolio', '作品集'], paused: false },
      ],
      routines: [
        { id: uid(), name: 'Chores', group: true, collapsed: false, paused: false, items: [
          leaf('Water the plants', 'weekly', ['浇', '植物', '浇花', '花', 'water', 'plant']),
          leaf('Laundry', 'weekly', ['洗衣', '衣服', 'laundry']),
          leaf('Wash the car', 'monthly', ['洗车', '车', 'car']),
          leaf('Deep clean the apartment', 'monthly', ['打扫', '大扫除', '扫除', 'clean']),
          leaf('Change the sheets', 'monthly', ['床单', '换床单', 'sheets']),
        ] },
        leaf('Teeth cleaning', 'yearly', ['洗牙', '牙', 'teeth']),
      ],
    };

    let data = JSON.parse(localStorage.getItem('halfyear-v5') || JSON.stringify(SEED));
    // fill in any missing fields for older saved data
    if (!data.sectionOrder) data.sectionOrder = ['body', 'savings', 'movement', 'projects', 'routines'];
    if (!data.sectionTitles) data.sectionTitles = { body: 'Body', savings: 'Savings', movement: 'Movement', projects: 'Projects', routines: 'Routines' };
    if (!data.bodyOrder) data.bodyOrder = ['sleep', 'weight'];
    if (!data.savings) data.savings = { tx: [] };
    let edit = false;
    let showGoals = false;
    let dueView = 'due';
    let bodyView = 'list';
    let sleepEditing = false;
    let weightEditing = false;
    let editingFrequency = {};
    let dataPanelOpen = false;
    let dataPanelSelected = new Set();

    // ---------------- Cloud sync (Supabase, no login) ----------------
    const SUPABASE_URL = 'https://qagmxlivtxpzpfvfozdk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1XZzc1JV8CPujd1zhcLcdQ_Hn6z646c';
    const SYNC_ROW_ID = 'julia';
    function supaHeaders(extra) {
      return Object.assign({
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
      }, extra || {});
    }
    function setSyncStatus(text) {
      const el = document.getElementById('syncStatus');
      if (el) el.textContent = text;
    }
    async function detailFromResponse(res) {
      let detail = String(res.status);
      try {
        const body = await res.json();
        if (body && body.message) detail += ': ' + body.message;
        else if (body && body.hint) detail += ': ' + body.hint;
      } catch (e) { /* body wasn't JSON */ }
      return detail;
    }
    async function supaLoad() {
      setSyncStatus('☁️ checking…');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.${SYNC_ROW_ID}&select=data,updated_at`, {
          headers: supaHeaders(),
        });
        if (!res.ok) throw new Error(await detailFromResponse(res));
        const rows = await res.json();
        if (rows && rows.length > 0 && rows[0].data) {
          data = rows[0].data;
          if (!data.sectionOrder) data.sectionOrder = ['body', 'savings', 'movement', 'projects', 'routines'];
          if (!data.sectionTitles) data.sectionTitles = { body: 'Body', savings: 'Savings', movement: 'Movement', projects: 'Projects', routines: 'Routines' };
          if (!data.bodyOrder) data.bodyOrder = ['sleep', 'weight'];
          if (!data.savings) data.savings = { tx: [] };
          localStorage.setItem('halfyear-v5', JSON.stringify(data));
          setSyncStatus('☁️ synced');
        } else {
          // no cloud row yet — push what we have locally to create it
          await supaSave();
        }
      } catch (e) {
        setSyncStatus('⚠️ ' + (e.message || 'offline'));
      }
      render();
    }
    async function supaSave() {
      setSyncStatus('☁️ saving…');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data`, {
          method: 'POST',
          headers: supaHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify({ id: SYNC_ROW_ID, data, updated_at: new Date().toISOString() }),
        });
        if (!res.ok) throw new Error(await detailFromResponse(res));
        setSyncStatus('☁️ synced');
      } catch (e) {
        setSyncStatus('⚠️ ' + (e.message || 'save failed'));
      }
    }
    let syncTimer = null;
    function supaSaveDebounced() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(supaSave, 900);
    }

    function saveData() {
      localStorage.setItem('halfyear-v5', JSON.stringify(data));
      supaSaveDebounced();
      render();
    }
    function toggleEdit() {
      edit = !edit;
      document.getElementById('editBtn').textContent = edit ? 'Confirm' : 'Edit';
      document.getElementById('editBtn').classList.toggle('on', edit);
      document.getElementById('quickWrap').style.display = edit ? 'none' : '';
      document.getElementById('dueBanner').style.display = edit ? 'none' : '';
      render();
    }

    function exportData() {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tracker-backup-${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          data = JSON.parse(ev.target.result);
          if (!data.sectionOrder) data.sectionOrder = ['body', 'savings', 'movement', 'projects', 'routines'];
          if (!data.sectionTitles) data.sectionTitles = { body: 'Body', savings: 'Savings', movement: 'Movement', projects: 'Projects', routines: 'Routines' };
          if (!data.bodyOrder) data.bodyOrder = ['sleep', 'weight'];
          if (!data.savings) data.savings = { tx: [] };
          saveData();
          alert('✓ Data imported successfully!');
        } catch (err) {
          alert('✗ Failed to import. Make sure it\'s a valid backup file.');
        }
      };
      reader.readAsText(file);
    }

    function arrMove(arr, idx, dir) {
      const j = idx + dir;
      if (j < 0 || j >= arr.length) return arr;
      const c = arr.slice();
      [c[idx], c[j]] = [c[j], c[idx]];
      return c;
    }

    function render() {
      const el = document.getElementById('sectionsContainer');
      let html = '';
      data.sectionOrder.forEach((key, i) => {
        html += renderSection(key, i, data.sectionOrder.length);
      });
      el.innerHTML = html;

      renderDueBanner();
      renderDataPanel();
    }

    function renderSection(key, idx, total) {
      const title = data.sectionTitles[key] || SECTION_TITLE[key] || key;
      let head = `<div class="sec-head${edit ? ' edit' : ''}"><input type="text" class="h2" value="${title}" onchange="updateSectionTitle('${key}', this.value)" />`;
      if (edit) {
        head += `<span class="arrows">
          <button class="arrow" ${idx === 0 ? 'disabled' : ''} onclick="moveSection(${idx},-1)">↑</button>
          <button class="arrow" ${idx === total - 1 ? 'disabled' : ''} onclick="moveSection(${idx},1)">↓</button>
        </span>`;
      } else if (key === 'movement') {
        head += `<span class="head-controls">
          <button class="editbtn${showGoals ? ' on' : ''}" onclick="toggleShowGoals()">Goal</button>
          <button class="plus" onclick="openAddActivityModal()">+</button>
        </span>`;
      } else if (key === 'body') {
        head += `<button class="editbtn${bodyView === 'chart' ? ' on' : ''}" onclick="toggleBodyView()">Chart</button>`;
      } else if (key === 'projects') {
        head += `<button class="plus" onclick="openAddProjectModal()">+</button>`;
      } else if (key === 'routines') {
        head += `<span class="head-controls">
          <button class="link" onclick="addGroup()">+ group</button>
          <button class="plus" onclick="openAddRoutineModal()">+</button>
        </span>`;
      }
      head += `</div>`;

      let body = '';
      if (key === 'body') body = renderBody();
      else if (key === 'savings') body = renderSavings();
      else if (key === 'movement') body = renderMovement();
      else if (key === 'projects') body = renderProjects();
      else if (key === 'routines') body = renderRoutines();

      return `<section class="section">${head}${body}</section>`;
    }
    function updateSectionTitle(key, value) { data.sectionTitles[key] = value; saveData(); }
    function toggleShowGoals() { showGoals = !showGoals; render(); }
    function toggleBodyView() { bodyView = bodyView === 'list' ? 'chart' : 'list'; render(); }
    function moveSection(idx, dir) { data.sectionOrder = arrMove(data.sectionOrder, idx, dir); saveData(); }

    // ---------------- Body (Sleep / Weight) ----------------
    function renderBody() {
      if (edit) {
        return data.bodyOrder.map((k, i) => `
          <div class="outrow">
            <span class="outname">${k === 'sleep' ? 'Sleep' : 'Weight'}</span>
            <span class="arrows">
              <button class="arrow" ${i === 0 ? 'disabled' : ''} onclick="moveBody(${i},-1)">↑</button>
              <button class="arrow" ${i === data.bodyOrder.length - 1 ? 'disabled' : ''} onclick="moveBody(${i},1)">↓</button>
            </span>
          </div>`).join('');
      }
      return data.bodyOrder.map(k => k === 'sleep' ? renderSleepCard() : renderWeightCard()).join('');
    }
    function moveBody(idx, dir) { data.bodyOrder = arrMove(data.bodyOrder, idx, dir); saveData(); }

    function renderSleepCard() {
      const today = todayKey();
      const te = data.sleep.entries.find(e => e.date === today);
      let html = `<div class="card${data.sleep.paused ? ' paused' : ''}">
        <div class="card-head">
          <span class="cname" style="border-bottom:none;">Sleep</span>
          ${data.sleep.paused
            ? `<span class="badge-pause">paused</span><button class="link" onclick="toggleSleepPause()">resume</button>`
            : `<button class="link" onclick="toggleSleepPause()">pause</button>`}
        </div>`;
      if (!data.sleep.paused) {
        if (bodyView === 'chart') {
          html += renderSleepChart();
        } else {
          const dur = te && sleepDur(te.bed, te.wake);
          if (te) {
            html += `<div class="pace" style="margin-top:4px;">
              last night: <b>${te.bed || '—'} → ${te.wake || '—'}</b>${dur ? ` · ${fmtMinutes(dur * 60)}` : ''}
            </div>`;
          }
          if (!te || sleepEditing) {
            html += `<div class="row">
              <span style="font-size:12px;color:var(--muted);">to bed</span>
              <input type="time" id="bedInput" value="${te ? te.bed : ''}" />
              <span style="font-size:12px;color:var(--muted);">up at</span>
              <input type="time" id="wakeInput" value="${te ? te.wake : ''}" />
              <button class="mini" onclick="saveSleep()">Save</button>
            </div>`;
          }
          if (te) {
            html += `<div class="row">
              <button class="link" onclick="toggleSleepEdit()">${sleepEditing ? 'close' : 'Edit'}</button>
            </div>`;
          }
        }
      }
      html += `</div>`;
      return html;
    }
    function saveSleep() {
      const bed = document.getElementById('bedInput').value;
      const wake = document.getElementById('wakeInput').value;
      if (!bed && !wake) return;
      data.sleep.entries = data.sleep.entries.filter(e => e.date !== todayKey());
      data.sleep.entries.push({ date: todayKey(), bed: bed || '', wake: wake || '' });
      sleepEditing = false;
      saveData();
    }
    function toggleSleepPause() { data.sleep.paused = !data.sleep.paused; saveData(); }
    function toggleSleepEdit() { sleepEditing = !sleepEditing; render(); }
    function renderSleepChart() {
      const entries = [...data.sleep.entries].filter(e => sleepDur(e.bed, e.wake) != null).sort((a, b) => (a.date < b.date ? -1 : 1)).slice(-30);
      if (entries.length === 0) return `<div class="pace" style="margin-top:8px;">Nothing logged yet.</div>`;
      const points = entries.map(e => ({ label: fmtShort(e.date), value: round1(sleepDur(e.bed, e.wake)) }));
      const avg = round1(points.reduce((s, p) => s + p.value, 0) / points.length);
      return svgLineChart(points, { summary: `avg ${avg}h over ${points.length} night${points.length === 1 ? '' : 's'}` });
    }

    function renderWeightCard() {
      const today = todayKey();
      const te = data.weight.entries.find(e => e.date === today);
      let html = `<div class="card${data.weight.paused ? ' paused' : ''}">
        <div class="card-head">
          <span class="cname" style="border-bottom:none;">Weight</span>
          ${data.weight.paused
            ? `<span class="badge-pause">paused</span><button class="link" onclick="toggleWeightPause()">resume</button>`
            : `<button class="link" onclick="toggleWeightPause()">pause</button>`}
        </div>`;
      if (!data.weight.paused) {
        if (bodyView === 'chart') {
          html += renderWeightChart();
        } else {
          if (te) {
            html += `<div class="pace" style="margin-top:4px;">
              today: <b>${te.am ?? '—'}</b> am · <b>${te.pm ?? '—'}</b> pm (kg)
            </div>`;
          }
          if (!te || weightEditing) {
            html += `<div class="row">
              <span style="font-size:12px;color:var(--muted);">morning</span>
              <input type="number" step="0.1" class="short" id="weightAm" value="${te && te.am != null ? te.am : ''}" />
              <span style="font-size:12px;color:var(--muted);">evening</span>
              <input type="number" step="0.1" class="short" id="weightPm" value="${te && te.pm != null ? te.pm : ''}" />
              <button class="mini" onclick="saveWeight()">Save</button>
            </div>`;
          }
          if (te) {
            html += `<div class="row">
              <button class="link" onclick="toggleWeightEdit()">${weightEditing ? 'close' : 'Edit'}</button>
            </div>`;
          }
        }
      }
      html += `</div>`;
      return html;
    }
    function saveWeight() {
      const am = document.getElementById('weightAm').value;
      const pm = document.getElementById('weightPm').value;
      if (!am && !pm) return;
      data.weight.entries = data.weight.entries.filter(e => e.date !== todayKey());
      data.weight.entries.push({ date: todayKey(), am: am ? parseFloat(am) : null, pm: pm ? parseFloat(pm) : null });
      weightEditing = false;
      saveData();
    }
    function toggleWeightPause() { data.weight.paused = !data.weight.paused; saveData(); }
    function toggleWeightEdit() { weightEditing = !weightEditing; render(); }
    function toggleWeightHist() { data.weight.showHist = !data.weight.showHist; saveData(); }
    function renderWeightChart() {
      const entries = [...data.weight.entries].filter(e => e.am != null || e.pm != null).sort((a, b) => (a.date < b.date ? -1 : 1)).slice(-30);
      if (entries.length === 0) return `<div class="pace" style="margin-top:8px;">Nothing logged yet.</div>`;
      const points = entries.map(e => ({ label: fmtShort(e.date), value: e.am ?? e.pm }));
      const diff = round1(points[points.length - 1].value - points[0].value);
      return svgLineChart(points, { summary: `${diff >= 0 ? '+' : ''}${diff} kg over ${points.length} reading${points.length === 1 ? '' : 's'}` });
    }
    function svgLineChart(points, opts) {
      opts = opts || {};
      const w = 300, h = 110, padL = 8, padR = 8, padT = 10, padB = 20;
      const vals = points.map(p => p.value);
      const minV = Math.min(...vals), maxV = Math.max(...vals);
      const span = (maxV - minV) || 1;
      const innerW = w - padL - padR, innerH = h - padT - padB;
      const stepX = points.length > 1 ? innerW / (points.length - 1) : 0;
      const coords = points.map((p, i) => ({ x: padL + stepX * i, y: padT + innerH - ((p.value - minV) / span) * innerH }));
      const path = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
      const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.5" fill="var(--accent)" />`).join('');
      return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible;margin-top:8px;">
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6" />
          ${dots}
          <text x="${padL}" y="${h - 4}" font-size="9" fill="var(--muted)">${points[0].label}</text>
          <text x="${w - padR}" y="${h - 4}" font-size="9" fill="var(--muted)" text-anchor="end">${points[points.length - 1].label}</text>
        </svg>
        <div class="pace" style="margin-top:2px;">${opts.summary || ''}</div>`;
    }

    // ---------------- Savings (coin jar) ----------------
    function coinSummary(c) {
      if (!c) return null;
      const p = [];
      if (c.g) p.push(`${c.g}×gold`); if (c.s) p.push(`${c.s}×silver`); if (c.b) p.push(`${c.b}×bronze`);
      return p.join(' · ');
    }
    function renderCoinStack(kind, count) {
      if (count <= 0) return '';
      const cap = 10;
      const shown = Math.min(count, cap);
      let coins = '';
      for (let i = 0; i < shown; i++) coins += `<div class="coin coin-${kind}"></div>`;
      return `<div class="coin-stack">
        <div class="coin-pile">${coins}</div>
        <div class="coin-label">${count}× ${kind}${count > cap ? ` (+${count - cap})` : ''}</div>
      </div>`;
    }
    function renderSavings() {
      const tx = data.savings.tx;
      const balance = tx.reduce((s, t) => s + (t.type === 'deposit' ? t.amount : -t.amount), 0);
      const gold = Math.floor(balance / 1000), rem = balance - gold * 1000;
      const silver = Math.floor(rem / 500), rem2 = rem - silver * 500;
      const bronze = Math.floor(rem2 / 100), loose = rem2 - bronze * 100;

      let html = `<div class="card">
        <div class="figure" style="margin-top:0;font-size:28px;">$${balance.toLocaleString()}</div>
        <div class="coins-row">
          ${renderCoinStack('gold', gold)}
          ${renderCoinStack('silver', silver)}
          ${renderCoinStack('bronze', bronze)}
        </div>
        ${loose ? `<div class="pace" style="margin-top:8px;">+$${loose} loose</div>` : ''}
        <div class="panel">
          <div class="field"><label>Coins</label>
            <span class="cdot" style="border-color:var(--gold);"></span><input type="number" min="0" placeholder="0" class="coin-in" id="coinG" />
            <span class="cdot" style="border-color:var(--silver);"></span><input type="number" min="0" placeholder="0" class="coin-in" id="coinS" />
            <span class="cdot" style="border-color:var(--bronze);"></span><input type="number" min="0" placeholder="0" class="coin-in" id="coinB" />
          </div>
          <div class="field"><label>For</label><input type="text" style="flex:1 1 120px;" id="coinPurpose" placeholder="what it's for (required to withdraw)" /></div>
          <div class="row">
            <button class="mini" onclick="savingsDeposit()">Deposit</button>
            <button class="mini" onclick="savingsWithdraw()">Withdraw</button>
            <span style="font-size:12px;color:var(--muted);margin-left:4px;">gold $1000 · silver $500 · bronze $100</span>
          </div>
        </div>
        <div id="savingsErr"></div>`;
      html += `</div>`;
      return html;
    }
    function toggleSavingsHist() { data.savings.showHist = !data.savings.showHist; saveData(); }
    function readCoins() {
      const g = +document.getElementById('coinG').value || 0;
      const s = +document.getElementById('coinS').value || 0;
      const b = +document.getElementById('coinB').value || 0;
      return { g, s, b, amount: g * 1000 + s * 500 + b * 100 };
    }
    function savingsErr(msg) { document.getElementById('savingsErr').innerHTML = msg ? `<div class="qfb err" style="margin-top:10px;">${msg}</div>` : ''; }
    function savingsDeposit() {
      const { g, s, b, amount } = readCoins();
      if (amount <= 0) { savingsErr('Pick at least one coin.'); return; }
      const purpose = document.getElementById('coinPurpose').value.trim();
      data.savings.tx.push({ id: uid(), type: 'deposit', amount, coins: { g, s, b }, purpose, date: todayKey() });
      saveData();
    }
    function savingsWithdraw() {
      const { g, s, b, amount } = readCoins();
      const balance = data.savings.tx.reduce((s2, t) => s2 + (t.type === 'deposit' ? t.amount : -t.amount), 0);
      if (amount <= 0) { savingsErr('Pick which coins to take out.'); return; }
      if (amount > balance) { savingsErr("That's more than the jar holds."); return; }
      const purpose = document.getElementById('coinPurpose').value.trim();
      if (!purpose) { savingsErr("Add what it's for."); return; }
      data.savings.tx.push({ id: uid(), type: 'withdraw', amount, coins: { g, s, b }, purpose, date: todayKey() });
      saveData();
    }

    // ---------------- Movement (activities) ----------------
    function renderMovement() {
      if (edit) {
        let html = data.activities.map((a, i) => `
          <div class="outrow">
            <span class="outname">${a.name || 'untitled'}</span>
            <span class="arrows">
              <button class="arrow" ${i === 0 ? 'disabled' : ''} onclick="moveActivity(${i},-1)">↑</button>
              <button class="arrow" ${i === data.activities.length - 1 ? 'disabled' : ''} onclick="moveActivity(${i},1)">↓</button>
            </span>
            <button class="btn-x" onclick="removeActivity('${a.id}')">${TRASH_ICON}</button>
          </div>`).join('');
        return html;
      }
      let html = '';
      const active = data.activities.filter(a => !a.paused);
      if (active.length > 0) html += renderMovementOverview(active);
      for (const act of data.activities) {
        const days = new Set(act.logs.map(l => l.date)).size;
        const totalMin = act.logs.reduce((s, l) => s + (l.minutes || 0), 0);
        const sessions = act.logs.length;
        html += `<div class="card${act.paused ? ' paused' : ''}">
          <div class="card-head">
            <input type="text" class="cname" value="${act.name}" onchange="updateActivity('${act.id}', 'name', this.value)" />
            ${act.paused
              ? `<span class="badge-pause">paused</span><button class="link" onclick="toggleActivityPause('${act.id}')">resume</button>`
              : `<button class="link" onclick="toggleActivityPause('${act.id}')">pause</button>`}
          </div>
          <div class="figure" style="font-size:20px;">${days}<small>days</small> · ${fmtMinutes(totalMin)}<small>total</small> · ${sessions}<small>sessions</small></div>`;
        if (act.hasGoal && !act.paused) {
          const cur = act.goalKind === 'hours' ? totalMin / 60 : act.goalKind === 'sessions' ? sessions : days;
          const rem = Math.max(act.target - cur, 0);
          const dLeft = Math.max(daysUntil(act.deadline), 0);
          const pw = dLeft > 0 ? rem / (dLeft / 7) : rem;
          const pct = act.target > 0 ? Math.min(cur / act.target, 1) : 0;
          html += `<div class="bar"><div class="bar-fill" style="width:${pct * 100}%;"></div></div>
            <div class="pace">${rem <= 0 ? `Goal reached — <b>${round1(cur)} ${act.goalKind}</b>.` : `${round1(cur)} of ${act.target} ${act.goalKind} · about <b>${round1(pw)} a week</b> to reach it by ${fmtShort(act.deadline)}`}</div>`;
        }
        if (!act.paused) {
          if (!showGoals) {
            html += `<div class="row">
              <input type="number" min="0" class="short" id="actMin${act.id}" /> <span style="font-size:12px;color:var(--muted);">min</span>
              <button class="mini" onclick="logActivity('${act.id}')">Add</button>
            </div>`;
          } else {
            html += `<div class="panel">
              <div class="field"><label>1 session</label><input type="number" min="0" class="short" value="${act.defaultMin ?? 30}" onchange="updateActivity('${act.id}', 'defaultMin', Number(this.value))" /><span style="font-size:12px;color:var(--muted);">min · used for "1次" &amp; bare logs</span></div>
              <div class="field"><label>Match</label><input type="text" style="flex:1 1 120px;" value="${(act.aliases || []).join(' ')}" placeholder="words the quick box should match" onchange="updateActivity('${act.id}', 'aliases', this.value.split(/[\\s,，、]+/).filter(Boolean))" /></div>
              <div class="field"><label>Goal</label><button class="chip${act.hasGoal ? ' on' : ''}" onclick="toggleActivityHasGoal('${act.id}')">${act.hasGoal ? 'on' : 'off'}</button></div>
              ${act.hasGoal ? `
              <div class="field"><label>Reach</label><input type="number" min="0" class="short" value="${act.target}" onchange="updateActivity('${act.id}', 'target', Number(this.value))" />
                <select onchange="updateActivity('${act.id}', 'goalKind', this.value)">
                  <option value="days" ${act.goalKind==='days'?'selected':''}>days</option>
                  <option value="hours" ${act.goalKind==='hours'?'selected':''}>hours</option>
                  <option value="sessions" ${act.goalKind==='sessions'?'selected':''}>sessions</option>
                </select></div>
              <div class="field"><label>By</label><input type="date" value="${act.deadline}" onchange="updateActivity('${act.id}', 'deadline', this.value)" /></div>` : ''}
            </div>`;
          }
        }
        html += `</div>`;
      }
      return html;
    }
    function renderMovementOverview(active) {
      const by = window._movementBy || 'days';
      const rows = active.map(a => {
        const days = new Set(a.logs.map(l => l.date)).size;
        const mins = a.logs.reduce((s, l) => s + (l.minutes || 0), 0);
        return { name: a.name, val: by === 'days' ? days : by === 'time' ? mins / 60 : a.logs.length };
      });
      const max = Math.max(1, ...rows.map(r => r.val));
      const fmt = by === 'time' ? (v) => `${round1(v)}h` : (v) => `${Math.round(v)}`;
      let html = `<div style="margin-bottom:8px;"><div class="chips">
        ${[['days','by days'],['time','by time'],['sessions','by sessions']].map(([k,l]) => `<button class="chip${by===k?' on':''}" onclick="setMovementBy('${k}')">${l}</button>`).join('')}
      </div>`;
      for (const r of rows) {
        html += `<div class="row" style="margin-top:9px;"><span style="flex:0 0 96px;font-size:13px;color:var(--ink);">${r.name}</span>
          <span style="flex:1 1 auto;height:7px;background:var(--line);border-radius:6px;overflow:hidden;"><span style="display:block;height:100%;background:var(--accent);border-radius:6px;width:${(r.val/max)*100}%;"></span></span>
          <span style="flex:0 0 auto;font-size:13px;color:var(--muted);width:44px;text-align:right;">${fmt(r.val)}</span></div>`;
      }
      html += `</div>`;
      return html;
    }
    function setMovementBy(k) { window._movementBy = k; render(); }
    function moveActivity(idx, dir) { data.activities = arrMove(data.activities, idx, dir); saveData(); }
    function updateActivity(id, field, value) { const a = data.activities.find(x => x.id === id); if (a) { a[field] = value; saveData(); } }
    function removeActivity(id) {
      const a = data.activities.find(x => x.id === id);
      if (!confirm(`Delete "${a ? a.name : 'this activity'}"? This can't be undone.`)) return;
      data.activities = data.activities.filter(x => x.id !== id);
      saveData();
    }
    function logActivity(id) {
      const mins = parseFloat(document.getElementById(`actMin${id}`).value);
      const a = data.activities.find(x => x.id === id);
      if (a) { a.logs.push({ id: uid(), date: todayKey(), minutes: mins || 0 }); saveData(); }
    }
    function removeActivityLog(actId, logId) { const a = data.activities.find(x => x.id === actId); if (a) { a.logs = a.logs.filter(l => l.id !== logId); saveData(); } }
    function toggleActivityHasGoal(id) { const a = data.activities.find(x => x.id === id); if (a) { a.hasGoal = !a.hasGoal; saveData(); } }
    function toggleActivityPause(id) { const a = data.activities.find(x => x.id === id); if (a) { a.paused = !a.paused; saveData(); } }
    function toggleActivityHist(id) { const a = data.activities.find(x => x.id === id); if (a) { a.showHist = !a.showHist; saveData(); } }
    function openAddActivityModal() {
      openModal(`
        <h3>Add an activity</h3>
        <div class="panel" style="margin-top:0;">
          <div class="field"><label>Name</label><input type="text" style="flex:1;" id="m_actName" /></div>
          <div class="field"><label>1 session</label><input type="number" min="0" class="short" id="m_actDefaultMin" value="30" /><span style="font-size:12px;color:var(--muted);">min</span></div>
          <div class="field"><label>Goal</label><button class="chip" id="m_actGoalChip" onclick="modalToggleActGoal()">off</button></div>
          <div id="m_actGoalFields" style="display:none;flex-direction:column;gap:11px;">
            <div class="field"><label>Reach</label><input type="number" min="0" class="short" id="m_actTarget" value="0" />
              <select id="m_actGoalKind">
                <option value="days">days</option>
                <option value="hours">hours</option>
                <option value="sessions">sessions</option>
              </select></div>
            <div class="field"><label>By</label><input type="date" id="m_actDeadline" value="2026-12-31" /></div>

    function moveProjectStage(id, idx, dir) {
      const p = data.projects.find(x => x.id === id);
      if (!p) return;
      const j = idx + dir;
      if (j < 0 || j >= p.stages.length) return;
      const stages = p.stages.slice();
      [stages[idx], stages[j]] = [stages[j], stages[idx]];
      let cur = p.current;
      if (cur === idx) cur = j; else if (cur === j) cur = idx;
      p.stages = stages;
      p.current = cur;
      saveData();
    }

    function renderRoutineGroup(group) {
      let html = `<div class="group">

    function renderRoutineRow(routine, groupPaused, groupId) {
      const paused = routine.paused || groupPaused;
      const due = routineDue(routine);
      let status = 'no date set', tone = 'muted';
      if (due) {
        const d = daysUntil(due), on = fmtShort(due);
        if (d < 0) { status = `${on} · overdue ${-d}d`; tone = 'warn'; }
        else if (d === 0) { status = `${on} · today`; tone = 'warn'; }
        else { status = `${on} · in ${d}d`; tone = 'ok'; }
      }
      const gid = groupId ? `, '${groupId}'` : '';
      const editingFreq = !!editingFrequency[routine.id];
      let html = `<div class="routine" style="${paused ? 'opacity:.5;' : ''}">

    function toggleEditFrequency(id) { editingFrequency[id] = !editingFrequency[id]; render(); }
    function moveRoutine(idx, dir) { data.routines = arrMove(data.routines, idx, dir); saveData(); }
    function moveRoutineItem(groupId, idx, dir) {
      const g = data.routines.find(e => e.id === groupId && e.group);
      if (g) { g.items = arrMove(g.items, idx, dir); saveData(); }
    }
    function moveRoutineToGroup(itemId, dest) {
      let moved = null;
      let next = data.routines.map(e => {
        if (e.group) {
          const j = e.items.findIndex(it => it.id === itemId);
          if (j >= 0) { moved = e.items[j]; const items = e.items.slice(); items.splice(j, 1); return { ...e, items }; }
        }
        return e;
      });
      if (!moved) {
        const idx = next.findIndex(e => !e.group && e.id === itemId);
        if (idx >= 0) { moved = next[idx]; next = next.filter(e => e.id !== itemId); }
      }
      if (!moved) return;
      if (dest === 'new') next = [...next, { id: uid(), name: 'New group', group: true, collapsed: false, paused: false, items: [moved] }];
      else if (dest === 'top') next = [...next, moved];
      else {
        let placed = false;
        next = next.map(e => { if (e.group && e.id === dest) { placed = true; return { ...e, items: [...e.items, moved] }; } return e; });
        if (!placed) next = [...next, moved];
      }
      data.routines = next;
      saveData();
    }
    function updateRoutine(id, field, value, groupId) {
      if (groupId) {
        const g = data.routines.find(e => e.id === groupId);
        if (g) { const it = g.items.find(x => x.id === id); if (it) { it[field] = value; saveData(); } }
      } else {
        const r = data.routines.find(x => x.id === id);
        if (r && !r.group) { r[field] = value; saveData(); }
      }
    }
    function removeRoutine(id, groupId) {
      let name = 'this';
      if (groupId) {
        const g = data.routines.find(e => e.id === groupId);
        const it = g && g.items.find(x => x.id === id);
        if (it) name = it.name;
      } else {
        const e = data.routines.find(x => x.id === id);
        if (e) name = e.name;
      }
      if (!confirm(`Delete "${name}"? This can't be undone.`)) return;
      if (groupId) {
        const g = data.routines.find(e => e.id === groupId);
        if (g) { g.items = g.items.filter(it => it.id !== id); saveData(); }

        data.routines = data.routines.filter(e => e.id !== id);

    }
    function markRoutineDone(id, groupId) {

      if (groupId) { const g = data.routines.find(e => e.id === groupId); if (g) { const it = g.items.find(x => x.id === id); if (it) mark(it); } }
      else { const r = data.routines.find(x => x.id === id); if (r && !r.group) mark(r); }
      saveData();
    }

    function toggleGroupPause(id) { const g = data.routines.find(e => e.id === id && e.group); if (g) { g.paused = !g.paused; saveData(); } }
    function updateGroup(id, field, value) { const g = data.routines.find(e => e.id === id && e.group); if (g) { g[field] = value; saveData(); } }
    function addRoutineToGroup(groupId, name, mode, cadence, dateVal) {

    // ---------------- Coming up / Summary (due banner) ----------------
    function setDueView(v) { dueView = v; renderDueBanner(); }
    function renderDueBanner() {
      const dueEl = document.getElementById('dueBanner');
      if (edit) { dueEl.innerHTML = ''; return; }
      let html = `<div class="due-banner">
        <div class="tabs">
          <button class="tab${dueView === 'due' ? ' on' : ''}" onclick="setDueView('due')">Coming up</button>
          <button class="tab${dueView === 'summary' ? ' on' : ''}" onclick="setDueView('summary')">Summary</button>
        </div>`;
      if (dueView === 'due') {
        const leaves = [];
        data.routines.forEach(e => {
          if (e.group) { if (!e.paused) e.items.forEach(it => { if (!it.paused) leaves.push(it); }); }
          else if (!e.paused) leaves.push(e);
        });
        const dueSoon = leaves
          .map(r => ({ r, due: routineDue(r) }))
          .filter(x => x.due && daysUntil(x.due) <= 3)
          .sort((a, b) => (a.due < b.due ? -1 : 1));
        if (dueSoon.length === 0) {
          html += `<div class="due-item">Nothing due soon.</div>`;
        } else {
          for (const { r, due } of dueSoon) {
            const d = daysUntil(due);
            const tail = d < 0 ? `<b>overdue ${-d}d</b>` : d === 0 ? `<b>today</b>` : `in ${d}d`;
            html += `<div class="due-item">${r.name} — ${fmtShort(due)}, ${tail}</div>`;
          }
        }
      } else {
        const lines = computeWeekSummary();
        if (lines.length === 0) {
          html += `<div class="due-item">Nothing logged yet this week.</div>`;
        } else {
          for (const line of lines) html += `<div class="due-item">${line}</div>`;
        }
      }
      html += `</div>`;
      dueEl.innerHTML = html;
    }
    function computeWeekSummary() {
      const start = new Date();
      start.setHours(0, 0, 0, 0);
      start.setDate(start.getDate() - 6);
      const inWeek = (dateStr) => parseDate(dateStr) >= start;
      const candidates = [];
      if (!data.sleep.paused) {
        const entries = data.sleep.entries.filter(e => inWeek(e.date));
        const earlyNights = entries.filter(e => { const v = bedVal(e.bed); return v != null && v <= 23.5; }).length;
        const earlyMornings = entries.filter(e => { const w = toMin(e.wake); return w != null && w <= 8 * 60; }).length;
        if (earlyNights > 0) candidates.push({ score: earlyNights + 0.5, text: `${earlyNights} night${earlyNights === 1 ? '' : 's'} in bed before 11:30 this week` });
        if (earlyMornings > 0) candidates.push({ score: earlyMornings + 0.5, text: `${earlyMornings} morning${earlyMornings === 1 ? '' : 's'} up before 8 this week` });
      }
      data.activities.forEach(a => {
        if (a.paused) return;
        const logs = a.logs.filter(l => inWeek(l.date));
        if (logs.length === 0) return;
        const mins = logs.reduce((s, l) => s + (l.minutes || 0), 0);
        const text = mins > 0
          ? `${a.name} ${logs.length}× this week — ${fmtMinutes(mins)}`
          : `${a.name} ${logs.length}× this week`;
        candidates.push({ score: mins || logs.length, text });
      });
      candidates.sort((a, b) => b.score - a.score);
      return candidates.slice(0, 3).map(c => c.text);
    }

    // ---------------- Quick log: natural-language matching ----------------
    function collectTargets() {
      const t = [];
      data.activities.forEach(a => { if (!a.paused) t.push({ type: 'activity', id: a.id, name: a.name, keys: [a.name, ...(a.aliases || [])] }); });
      data.routines.forEach(e => {
        if (e.group) { if (!e.paused) e.items.forEach(it => { if (!it.paused) t.push({ type: 'routine', groupId: e.id, id: it.id, name: it.name, keys: [it.name, ...(it.aliases || [])] }); }); }
        else if (!e.paused) t.push({ type: 'routine', id: e.id, name: e.name, keys: [e.name, ...(e.aliases || [])] });
      });
      data.projects.forEach(p => { if (!p.paused) t.push({ type: 'project', id: p.id, name: p.name, keys: [p.name, ...(p.aliases || [])] }); });
      return t;
    }
    function extractQty(low) {
      let minutes = null, count = null, m;
      if ((m = low.match(/(\d+(?:\.\d+)?)\s*(小时|時|时|hours?|hrs?|h)/))) minutes = parseFloat(m[1]) * 60;
      else if ((m = low.match(/(\d+(?:\.\d+)?)\s*(分钟|分鐘|分|minutes?|mins?|min|m)/))) minutes = parseFloat(m[1]);
      if ((m = low.match(/(\d+)\s*(次|回|times?|x)/))) count = parseInt(m[1], 10);
      return { minutes, count };
    }
    let lastUndo = null;
    function handleQuick() {
      const input = document.getElementById('quickInput');
      const raw = (input.value || '').trim();
      if (!raw) return;
      const low = raw.toLowerCase();
      let best = null, bestLen = 0;
      collectTargets().forEach(t => t.keys.forEach(k => {
        if (k) { const kk = k.toLowerCase(); if (low.includes(kk) && kk.length > bestLen) { best = t; bestLen = kk.length; } }
      }));
      const fbEl = document.getElementById('quickFeedback');
      if (!best) { fbEl.innerHTML = `<div class="qfb err">No match for "${raw}". Try an activity or routine name.</div>`; return; }
      const { minutes, count } = extractQty(low);
      lastUndo = JSON.parse(JSON.stringify(data));
      let msg = '';
      if (best.type === 'activity') {
        const a = data.activities.find(x => x.id === best.id);
        const per = minutes != null ? minutes : (a.defaultMin || 0);
        const nlg = count || 1;
        for (let i = 0; i < nlg; i++) a.logs.push({ id: uid(), date: todayKey(), minutes: per });
        msg = `Logged ${nlg > 1 ? nlg + '× ' : ''}${per ? fmtMinutes(per) : 'a day'} to ${a.name}.`;
      } else if (best.type === 'routine') {
        const t = todayKey();
        const mark = (it) => { if (!it.history.includes(t)) it.history.push(t); if (it.mode === 'date') it.nextDate = null; };
        if (best.groupId) { const g = data.routines.find(e => e.id === best.groupId); mark(g.items.find(x => x.id === best.id)); }
        else mark(data.routines.find(x => x.id === best.id));
        msg = `Marked ${best.name} done.`;
      } else {
        if (minutes == null) { fbEl.innerHTML = `<div class="qfb err">How long? e.g. "${best.name} 30分钟".</div>`; return; }
        const p = data.projects.find(x => x.id === best.id);
        p.sessions.push({ id: uid(), date: todayKey(), minutes, note: '' });
        msg = `Logged ${fmtMinutes(minutes)} to ${p.name}.`;
      }
      fbEl.innerHTML = `<div class="qfb ok">${msg} · <button class="link" onclick="quickUndo()">undo</button></div>`;
      input.value = '';
      saveData();
    }
    function quickUndo() {
      if (lastUndo) { data = lastUndo; lastUndo = null; document.getElementById('quickFeedback').innerHTML = `<div class="qfb ok">Undone.</div>`; saveData(); }
    }

    // ---------------- All data (list + bulk delete) ----------------
    function collectAllEntries() {
      const rows = [];
      data.sleep.entries.forEach(e => rows.push({ key: `sleep:${e.date}`, date: e.date, label: `Sleep — ${e.bed || '—'} → ${e.wake || '—'}` }));
      data.weight.entries.forEach(e => rows.push({ key: `weight:${e.date}`, date: e.date, label: `Weight — ${e.am ?? '—'} am / ${e.pm ?? '—'} pm` }));
      data.savings.tx.forEach(t => rows.push({ key: `savings:${t.id}`, date: t.date, label: `Savings — ${t.type === 'deposit' ? '+' : '−'}$${t.amount}${t.purpose ? ` · ${t.purpose}` : ''}` }));
      data.activities.forEach(a => a.logs.forEach(l => rows.push({ key: `activity:${a.id}:${l.id}`, date: l.date, label: `${a.name} — ${l.minutes ? fmtMinutes(l.minutes) : 'logged'}` })));
      data.projects.forEach(p => p.sessions.forEach(s => rows.push({ key: `project:${p.id}:${s.id}`, date: s.date, label: `${p.name} — ${fmtMinutes(s.minutes)}${s.note ? ` · ${s.note}` : ''}` })));
      const walkRoutine = (r, groupName) => {
        (r.history || []).forEach(d => rows.push({ key: `routine:${r.id}:${d}`, date: d, label: `${groupName ? groupName + ' · ' : ''}${r.name} — done` }));
      };
      data.routines.forEach(e => {
        if (e.group) e.items.forEach(it => walkRoutine(it, e.name));
        else walkRoutine(e, null);
      });
      rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
      return rows;
    }
    function deleteEntryByKey(key) {
      const parts = key.split(':');
      const kind = parts[0];
      if (kind === 'sleep') { data.sleep.entries = data.sleep.entries.filter(e => e.date !== parts[1]); }
      else if (kind === 'weight') { data.weight.entries = data.weight.entries.filter(e => e.date !== parts[1]); }
      else if (kind === 'savings') { data.savings.tx = data.savings.tx.filter(t => t.id !== parts[1]); }
      else if (kind === 'activity') { const a = data.activities.find(x => x.id === parts[1]); if (a) a.logs = a.logs.filter(l => l.id !== parts[2]); }
      else if (kind === 'project') { const p = data.projects.find(x => x.id === parts[1]); if (p) p.sessions = p.sessions.filter(s => s.id !== parts[2]); }
      else if (kind === 'routine') {
        const rid = parts[1], date = parts[2];
        let found = data.routines.find(e => !e.group && e.id === rid);
        if (found) { found.history = found.history.filter(d => d !== date); }
        else {
          for (const g of data.routines) {
            if (g.group) { const it = g.items.find(x => x.id === rid); if (it) { it.history = it.history.filter(d => d !== date); break; } }
          }
        }
      }
    }
    function toggleDataPanel() { dataPanelOpen = !dataPanelOpen; if (!dataPanelOpen) dataPanelSelected.clear(); renderDataPanel(); }
    function toggleDataRow(key) { if (dataPanelSelected.has(key)) dataPanelSelected.delete(key); else dataPanelSelected.add(key); renderDataPanel(); }
    function deleteSelectedData() {
      if (dataPanelSelected.size === 0) return;
      if (!confirm(`Delete ${dataPanelSelected.size} entr${dataPanelSelected.size === 1 ? 'y' : 'ies'}? This can't be undone.`)) return;
      dataPanelSelected.forEach(k => deleteEntryByKey(k));
      dataPanelSelected.clear();
      saveData();
    }
    function renderDataPanel() {
      const el = document.getElementById('dataPanel');
      if (!dataPanelOpen) { el.innerHTML = ''; return; }
      const rows = collectAllEntries();
      let html = `<div class="due-banner" style="margin-top:12px;">
        <div class="row" style="margin-top:0;justify-content:space-between;">
          <span class="meta">${rows.length} entries</span>
          <button class="link" onclick="deleteSelectedData()">Delete selected (${dataPanelSelected.size})</button>
        </div>`;
      if (rows.length === 0) {
        html += `<div class="due-item">Nothing logged yet.</div>`;
      } else {
        for (const r of rows) {
          html += `<label class="data-row">
            <input type="checkbox" ${dataPanelSelected.has(r.key) ? 'checked' : ''} onchange="toggleDataRow('${r.key}')" />
            <span class="data-date">${fmtShort(r.date)}</span>
            <span class="data-label">${r.label}</span>
          </label>`;
        }
      }
      html += `</div>`;
      el.innerHTML = html;
    }

    setTodayLabel();
    render();
    supaLoad();
  </script>
</body>
</html>
