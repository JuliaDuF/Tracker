<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Second Half</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/recharts@2.10.0/dist/Recharts.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Newsreader:ital,opsz@1,6..72&family=Inter:wght@400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paper: #E7E7E0;
      --surface: #F1F1EB;
      --ink: #2A2B26;
      --muted: #83857A;
      --line: #D4D4CA;
      --accent: #6F7F73;
      --accent-ink: #55634F;
      --accent-soft: rgba(111, 127, 115, 0.13);
      --warn: #A8735B;
      --f-display: 'Fraunces', Georgia, serif;
      --f-note: 'Newsreader', Georgia, serif;
      --f-body: 'Inter', system-ui, -apple-system, sans-serif;
    }
    html, body { min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--f-body); }
    #root { min-height: 100vh; }
    .hy-wrap { max-width: 680px; margin: 0 auto; padding: 56px 26px 128px; }
    .hy-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
    .hy-editbtn { font-family: inherit; font-size: 13px; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid transparent; border-radius: 20px; padding: 8px 18px; cursor: pointer; letter-spacing: 0.02em; }
    .hy-editbtn.on { background: var(--accent); color: #fff; }
    .hy-eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .hy-title { font-family: var(--f-display); font-weight: 500; font-size: clamp(32px, 7vw, 46px); line-height: 1.04; letter-spacing: -0.01em; margin: 14px 0 0; }
    .hy-note { font-family: var(--f-note); font-style: italic; font-size: 19px; color: var(--muted); margin: 18px 0 0; line-height: 1.5; max-width: 44ch; }
    .hy-authpanel { margin-top: 56px; padding: 28px; background: var(--surface); border-radius: 13px; display: flex; flex-direction: column; gap: 14px; max-width: 400px; }
    .hy-authpanel h2 { font-family: var(--f-display); font-weight: 500; font-size: 22px; margin: 0 0 8px; }
    .hy-authpanel form { display: flex; flex-direction: column; gap: 10px; }
    .hy-input { font-size: 16px; font-family: inherit; color: var(--ink); background: transparent; border: none; border-bottom: 1px solid var(--line); padding: 8px 0; }
    .hy-input::placeholder { color: var(--muted); }
    .hy-input:focus { outline: none; border-bottom-color: var(--accent); }
    .hy-mini { font-size: 14px; font-family: inherit; color: var(--accent-ink); background: var(--accent-soft); border: none; border-radius: 8px; padding: 8px 13px; cursor: pointer; transition: background 0.15s; }
    .hy-mini:hover { background: rgba(111, 127, 115, 0.22); }
    .hy-authinfo { font-size: 13px; color: var(--muted); text-align: center; }
    .hy-section { margin-top: 56px; }
    .hy-shead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 10px; }
    .hy-h2 { font-family: var(--f-display); font-weight: 500; font-size: 22px; letter-spacing: -0.01em; }
    .hy-meta { font-size: 12px; letter-spacing: 0.03em; color: var(--muted); }
    .hy-card { padding: 22px 0; border-bottom: 1px solid var(--line); }
    .hy-card-head { display: flex; align-items: center; gap: 10px; }
    .hy-cname { flex: 1 1 auto; font-family: var(--f-display); font-weight: 500; font-size: 18px; color: var(--ink); background: none; border: none; border-bottom: 1px solid transparent; padding: 2px 0; }
    .hy-cname:focus { outline: none; border-bottom-color: var(--accent); }
    .hy-figure { font-family: var(--f-display); font-weight: 500; font-size: 24px; letter-spacing: -0.01em; margin-top: 12px; }
    .hy-figure small { font-size: 14px; color: var(--muted); font-family: var(--f-body); font-weight: 400; margin-left: 7px; }
    .hy-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .hy-link { background: none; border: none; color: var(--muted); font-size: 12.5px; letter-spacing: 0.03em; cursor: pointer; padding: 0; font-family: inherit; }
    .hy-link:hover { color: var(--ink); }
    .hy-num, .hy-date, .hy-sel, .hy-text, .hy-time { font-family: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
    .hy-num { width: 84px; }
    .hy-text { flex: 1 1 120px; min-width: 0; }
    .hy-lab { font-size: 12px; color: var(--muted); }
    .hy-panel { margin-top: 14px; padding: 15px; background: var(--surface); border-radius: 11px; display: flex; flex-direction: column; gap: 11px; }
    .hy-field { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .hy-field label { min-width: 64px; }
    .hy-quick { margin-top: 26px; }
    .hy-quickbox { display: flex; gap: 10px; align-items: center; }
    .hy-qinput { flex: 1 1 auto; font-family: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
    .hy-qinput::placeholder { color: var(--muted); }
    .hy-qinput:focus { outline: none; border-color: var(--accent); }
    .hy-qfb { font-size: 13px; margin-top: 9px; }
    .hy-qfb.ok { color: var(--accent-ink); }
    .hy-qfb.err { color: var(--warn); }
    .hy-qhint { font-size: 12.5px; color: var(--muted); margin-top: 9px; line-height: 1.4; }
    .hy-loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: var(--f-note); font-style: italic; font-size: 18px; }
    .hy-foot { margin-top: 78px; font-family: var(--f-note); font-style: italic; font-size: 16px; color: var(--muted); text-align: center; }
    .hy-empty { font-family: var(--f-note); font-style: italic; color: var(--muted); font-size: 15px; padding: 18px 0; }
    .paused-card { opacity: 0.5; }
    .hy-pausebadge { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 20px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const SUPABASE_URL = 'https://qagmxlivtxpzpfvfozdk.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_1XZzc1JV8CPujd1zhcLcdQ_Hn6z646c';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const uid = () => Math.random().toString(36).slice(2, 9);
    const todayKey = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const SEED = {
      sectionOrder: ['body', 'savings', 'movement', 'projects', 'routines'],
      bodyOrder: ['sleep', 'weight'],
      sleep: { entries: [], paused: false },
      weight: { unit: 'kg', entries: [], paused: false },
      savings: { tx: [] },
      activities: [
        { id: uid(), name: 'Yoga', hasGoal: true, goalKind: 'days', target: 100, deadline: '2026-12-31', defaultMin: 30, aliases: [], logs: [], paused: false },
      ],
      projects: [],
      routines: [],
    };

    function normalize(d) {
      return {
        sectionOrder: d?.sectionOrder || [...SEED.sectionOrder],
        bodyOrder: d?.bodyOrder || [...SEED.bodyOrder],
        sleep: { entries: d?.sleep?.entries || [], paused: d?.sleep?.paused || false },
        weight: { unit: d?.weight?.unit || 'kg', entries: d?.weight?.entries || [], paused: d?.weight?.paused || false },
        savings: { tx: d?.savings?.tx || [] },
        activities: d?.activities || SEED.activities,
        projects: d?.projects || [],
        routines: d?.routines || [],
      };
    }

    function HalfYear() {
      const [user, setUser] = useState(null);
      const [data, setData] = useState(null);
      const [loaded, setLoaded] = useState(false);
      const [email, setEmail] = useState('');
      const [authMsg, setAuthMsg] = useState('');
      const [quick, setQuick] = useState('');
      const [feedback, setFeedback] = useState(null);

      useEffect(() => {
        const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
          if (session?.user) {
            setUser(session.user);
            try {
              const { data: rows } = await supabase.from('tracking_data').select('data').eq('user_id', session.user.id).single();
              setData(normalize(rows?.data || SEED));
            } catch (e) {
              console.error('Load error:', e);
              setData(normalize(SEED));
            }
          } else {
            setUser(null);
            setData(null);
          }
          setLoaded(true);
        });
        return () => subscription?.unsubscribe();
      }, []);

      useEffect(() => {
        if (!loaded || !data || !user) return;
        const t = setTimeout(async () => {
          try {
            await supabase.from('tracking_data').upsert({ user_id: user.id, data, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
          } catch (e) {
            console.error('Save error:', e);
          }
        }, 400);
        return () => clearTimeout(t);
      }, [data, loaded, user]);

      const sendMagicLink = async (e) => {
        e.preventDefault();
        if (!email) { setAuthMsg('Enter your email.'); return; }
        setAuthMsg('Sendingâ¦');
        const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin } });
        if (error) setAuthMsg(`Error: ${error.message}`);
        else { setAuthMsg(`Check your email for the login link`); setEmail(''); }
      };

      if (!loaded) return <div className="hy-loading">gathering your pagesâ¦</div>;

      if (!user) {
        return (
          <div className="hy-wrap">
            <header>
              <div className="hy-eyebrow">2026 Â· your own pace</div>
              <h1 className="hy-title">The second half</h1>
              <p className="hy-note">Track the small things. Sleep, weight, movement, savings, routines, projects â all in one quiet place.</p>
            </header>
            <div className="hy-authpanel">
              <h2>Log in with email</h2>
              <form onSubmit={sendMagicLink}>
                <input className="hy-input" type="email" placeholder="your email" value={email} onChange={(e) => setEmail(e.target.value)} />
                <button className="hy-mini" type="submit">Send login link</button>
              </form>
              {authMsg && <div className="hy-authinfo">{authMsg}</div>}
            </div>
          </div>
        );
      }

      return (
        <div className="hy-wrap">
          <header>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div className="hy-eyebrow">2026 Â· your own pace</div>
              <div style={{ fontSize: 12, color: 'var(--muted)' }}>
                {user.email} Â· <button className="hy-link" onClick={() => supabase.auth.signOut()}>log out</button>
              </div>
            </div>
            <h1 className="hy-title">The second half</h1>
            <p className="hy-note">Everything is saved to the cloud. Log from any device.</p>
          </header>

          <div className="hy-quick">
            <div className="hy-quickbox">
              <input className="hy-qinput" value={quick} onChange={(e) => setQuick(e.target.value)} placeholder="say it plainlyâ¦" />
              <button className="hy-mini" onClick={() => setQuick('')}>log</button>
            </div>
            {feedback && <div className={`hy-qfb ${feedback.type}`}>{feedback.msg}</div>}
            <div className="hy-qhint">Type a name to log. Cloud synced.</div>
          </div>

          <p className="hy-foot">Steady is enough. Set aside what you need to; come back when you're ready.</p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HalfYear />);
  </script>
</body>
</html>
