<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Second Half</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500&family=Inter:wght@400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #E7E7E0; color: #2A2B26; font-family: 'Inter', sans-serif; min-height: 100vh; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 56px 26px 128px; }
    .title { font-family: 'Fraunces', serif; font-size: 42px; font-weight: 500; margin: 14px 0 20px; }
    .subtitle { font-size: 14px; color: #83857A; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 20px; }
    .note { font-style: italic; font-size: 16px; color: #83857A; margin: 18px 0 28px; line-height: 1.5; }
    .panel { background: #F1F1EB; border-radius: 13px; padding: 28px; margin-top: 28px; }
    .input { font-size: 16px; font-family: inherit; color: #2A2B26; background: transparent; border: none; border-bottom: 1px solid #D4D4CA; padding: 8px 0; width: 100%; }
    .input:focus { outline: none; border-bottom-color: #6F7F73; }
    .btn { font-family: inherit; font-size: 14px; background: #6F7F73; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; margin-top: 14px; }
    .btn:hover { background: #5a6b63; }
    .section { margin-top: 56px; }
    .shead { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; border-bottom: 1px solid #D4D4CA; padding-bottom: 12px; margin-bottom: 14px; }
    .meta { font-size: 12px; color: #83857A; }
    .card { padding: 22px 0; border-bottom: 1px solid #D4D4CA; }
    .cardhead { display: flex; gap: 10px; align-items: center; }
    .cname { flex: 1; font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; background: none; border: none; border-bottom: 1px solid transparent; padding: 2px 0; }
    .cname:focus { outline: none; border-bottom-color: #6F7F73; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
    .mini { font-family: inherit; font-size: 13px; background: #D4D4CA; color: #2A2B26; border: none; border-radius: 8px; padding: 8px 13px; cursor: pointer; }
    .mini:hover { background: #c8c8bb; }
    .link { background: none; border: none; color: #83857A; font-size: 12px; cursor: pointer; font-family: inherit; padding: 0; }
    .link:hover { color: #2A2B26; }
    .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-style: italic; color: #83857A; }
    .msg { font-size: 13px; color: #83857A; margin-top: 10px; }
    .err { color: #A8735B; }
    .ok { color: #55634F; }
    .lab { font-size: 12px; color: #83857A; }
    .num { width: 80px; }
    .foot { margin-top: 78px; font-style: italic; font-size: 16px; color: #83857A; text-align: center; }
    .stat { font-size: 24px; font-family: 'Fraunces', serif; font-weight: 500; margin-top: 12px; }
    .small { font-size: 13px; color: #83857A; margin-left: 8px; }
    input, select { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://qagmx1ivtxpzpfvfozdk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1XZzc1JV8CPujd1zhcLcdQ_Hn6z646c';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const uid = () => Math.random().toString(36).slice(2, 9);
    const todayKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const fmtShort = (s) => {
      try {
        const [y, m, d] = s.split('-').map(Number);
        return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      } catch { return s; }
    };
    const fmtMin = (m) => m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;

    const SEED = {
      sleep: { entries: [], paused: false },
      weight: { unit: 'kg', entries: [], paused: false },
      activities: [
        { id: uid(), name: 'Yoga', logs: [], paused: false },
        { id: uid(), name: 'Walk', logs: [], paused: false },
      ],
      routines: [
        { id: uid(), name: 'Water plants', cadence: 'weekly', history: [], paused: false },
      ],
    };

    const SleepCard = ({ sleep, onChange }) => {
      const [bed, setBed] = useState('');
      const [wake, setWake] = useState('');
      if (sleep.paused) return <div className="card"><div className="cardhead"><span className="cname">Sleep</span><span style={{ fontSize: '10px', color: '#83857A' }}>PAUSED</span></div></div>;
      const today = todayKey();
      const te = sleep.entries.find(e => e.date === today);
      const save = () => {
        if (!bed && !wake) return;
        const entries = sleep.entries.filter(e => e.date !== today);
        entries.push({ date: today, bed: bed || '', wake: wake || '' });
        onChange({ ...sleep, entries });
        setBed(''); setWake('');
      };
      return (
        <div className="card">
          <div className="cardhead"><span className="cname">Sleep</span></div>
          <div style={{ fontSize: '15px', color: '#83857A', marginTop: '8px' }}>
            {te ? `${te.bed} → ${te.wake}` : 'when did you sleep?'}
          </div>
          <div className="row">
            <span className="lab">bed</span>
            <input type="time" value={bed} onChange={e => setBed(e.target.value)} style={{ flex: 1, minWidth: '120px' }} />
            <span className="lab">wake</span>
            <input type="time" value={wake} onChange={e => setWake(e.target.value)} style={{ flex: 1, minWidth: '120px' }} />
            <button className="mini" onClick={save}>save</button>
          </div>
        </div>
      );
    };

    const WeightCard = ({ weight, onChange }) => {
      const [am, setAm] = useState('');
      const [pm, setPm] = useState('');
      if (weight.paused) return <div className="card"><div className="cardhead"><span className="cname">Weight</span><span style={{ fontSize: '10px', color: '#83857A' }}>PAUSED</span></div></div>;
      const today = todayKey();
      const te = weight.entries.find(e => e.date === today);
      const u = weight.unit || 'kg';
      const save = () => {
        if (!am && !pm) return;
        const entries = weight.entries.filter(e => e.date !== today);
        entries.push({ date: today, am: am ? parseFloat(am) : null, pm: pm ? parseFloat(pm) : null });
        onChange({ ...weight, entries, unit: u });
        setAm(''); setPm('');
      };
      return (
        <div className="card">
          <div className="cardhead"><span className="cname">Weight</span><span className="lab" style={{ marginLeft: 'auto' }}>{u}</span></div>
          <div style={{ fontSize: '15px', color: '#83857A', marginTop: '8px' }}>
            {te ? `${te.am} / ${te.pm}` : 'morning & evening'}
          </div>
          <div className="row">
            <input type="number" step="0.1" placeholder="am" value={am} onChange={e => setAm(e.target.value)} className="num" />
            <input type="number" step="0.1" placeholder="pm" value={pm} onChange={e => setPm(e.target.value)} className="num" />
            <button className="mini" onClick={save}>save</button>
          </div>
        </div>
      );
    };

    const ActivityCard = ({ act, onChange, onRemove }) => {
      const [mins, setMins] = useState('');
      if (act.paused) return <div className="card"><div className="cardhead"><span className="cname">{act.name}</span><span style={{ fontSize: '10px', color: '#83857A' }}>PAUSED</span></div></div>;
      const totalMin = act.logs.reduce((s, l) => s + (l.minutes || 0), 0);
      const days = new Set(act.logs.map(l => l.date)).size;
      const log = () => {
        const m = mins ? parseFloat(mins) : 0;
        onChange({ ...act, logs: [...act.logs, { id: uid(), date: todayKey(), minutes: m }] });
        setMins('');
      };
      return (
        <div className="card">
          <div className="cardhead">
            <input className="cname" value={act.name} onChange={e => onChange({ ...act, name: e.target.value })} />
            <button className="link" onClick={onRemove}>✕</button>
          </div>
          <div className="stat">{days}<span className="small">days</span> · {fmtMin(totalMin)}<span className="small">total</span></div>
          <div className="row">
            <input type="number" placeholder="min" value={mins} onChange={e => setMins(e.target.value)} className="num" />
            <button className="mini" onClick={log}>log</button>
            <button className="link" onClick={() => onChange({ ...act, paused: true })}>pause</button>
          </div>
        </div>
      );
    };

    const RoutineRow = ({ routine, onChange, onRemove }) => {
      const done = routine.history.includes(todayKey());
      const mark = () => {
        const t = todayKey();
        const history = routine.history.includes(t) ? routine.history : [...routine.history, t];
        onChange({ ...routine, history });
      };
      if (routine.paused) return <div className="card"><div className="cardhead"><span className="cname">{routine.name}</span><span style={{ fontSize: '10px', color: '#83857A' }}>PAUSED</span></div></div>;
      return (
        <div className="card">
          <div className="cardhead">
            <input className="cname" value={routine.name} onChange={e => onChange({ ...routine, name: e.target.value })} />
            <button className="mini" onClick={mark}>{done ? '✓ done' : 'mark'}</button>
            <button className="link" onClick={() => onChange({ ...routine, paused: true })}>pause</button>
            <button className="link" onClick={onRemove}>✕</button>
          </div>
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [data, setData] = useState(null);
      const [loaded, setLoaded] = useState(false);
      const [email, setEmail] = useState('');
      const [msg, setMsg] = useState('');

      useEffect(() => {
        const saved = localStorage.getItem('hy_email');
        if (saved) setEmail(saved);

        const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
          if (session?.user) {
            setUser(session.user);
            localStorage.setItem('hy_email', session.user.email);
            try {
              const { data: rows } = await supabase.from('tracking_data').select('data').eq('user_id', session.user.id).single();
              setData(rows?.data ? { ...SEED, ...rows.data } : SEED);
            } catch {
              setData(SEED);
            }
          } else {
            setUser(null);
            setData(null);
          }
          setLoaded(true);
        });

        return () => subscription?.unsubscribe();
      }, []);

      useEffect(() => {
        if (!loaded || !data || !user) return;
        const t = setTimeout(async () => {
          try {
            await supabase.from('tracking_data').upsert({ user_id: user.id, data, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
          } catch (e) { }
        }, 500);
        return () => clearTimeout(t);
      }, [data, loaded, user]);

      const sendLink = async (e) => {
        e.preventDefault();
        if (!email) { setMsg('enter email'); return; }
        setMsg('sending…');
        const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin } });
        if (error) setMsg(`error: ${error.message}`);
        else { setMsg('check email for login link'); setEmail(''); }
      };

      if (!loaded) return <div className="loading">loading…</div>;

      if (!user) {
        return (
          <div className="wrap">
            <div className="subtitle">2026 · your own pace</div>
            <h1 className="title">The second half</h1>
            <p className="note">Track the small things. Sleep, weight, movement, routines — all in one quiet place.</p>
            <div className="panel">
              <h2 style={{ fontFamily: "'Fraunces', serif", fontSize: '20px', marginBottom: '14px' }}>Log in</h2>
              <form onSubmit={sendLink}>
                <input type="email" className="input" placeholder="your email" value={email} onChange={e => setEmail(e.target.value)} />
                <button type="submit" className="btn">send login link</button>
              </form>
              {msg && <div className={`msg ${msg.includes('error') ? 'err' : 'ok'}`}>{msg}</div>}
            </div>
          </div>
        );
      }

      return (
        <div className="wrap">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div className="subtitle">2026 · your own pace</div>
            <div style={{ fontSize: '12px', color: '#83857A' }}>
              {user.email} · <button className="link" onClick={() => supabase.auth.signOut()}>out</button>
            </div>
          </div>
          <h1 className="title">The second half</h1>
          <p className="note">Everything is saved to the cloud.</p>

          <section className="section">
            <div className="shead">Body</div>
            {data && (
              <>
                <SleepCard sleep={data.sleep} onChange={v => setData({ ...data, sleep: v })} />
                <WeightCard weight={data.weight} onChange={v => setData({ ...data, weight: v })} />
              </>
            )}
          </section>

          <section className="section">
            <div className="shead">Movement</div>
            {data && data.activities.map(a => (
              <ActivityCard key={a.id} act={a} onChange={v => setData({ ...data, activities: data.activities.map(x => x.id === a.id ? v : x) })} onRemove={() => setData({ ...data, activities: data.activities.filter(x => x.id !== a.id) })} />
            ))}
            <div className="card" style={{ borderBottom: 'none' }}>
              <button className="mini" onClick={() => setData({ ...data, activities: [...data.activities, { id: uid(), name: 'New activity', logs: [], paused: false }] })}>+ activity</button>
            </div>
          </section>

          <section className="section">
            <div className="shead">Routines</div>
            {data && data.routines.map(r => (
              <RoutineRow key={r.id} routine={r} onChange={v => setData({ ...data, routines: data.routines.map(x => x.id === r.id ? v : x) })} onRemove={() => setData({ ...data, routines: data.routines.filter(x => x.id !== r.id) })} />
            ))}
            <div className="card" style={{ borderBottom: 'none' }}>
              <button className="mini" onClick={() => setData({ ...data, routines: [...data.routines, { id: uid(), name: 'New routine', cadence: 'weekly', history: [], paused: false }] })}>+ routine</button>
            </div>
          </section>

          <p className="foot">Steady is enough. Set aside what you need to; come back when you're ready.</p>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
